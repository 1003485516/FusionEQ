# ===========================================================================
#  Fusion EQ — macOS 自动构建 + 打包 + 签名 + 公证（GitHub Actions）
#
#  触发：
#    - 推送以 v 开头的 tag（如 v1.0.0）→ 自动出包
#    - 在 Actions 页面点 "Run workflow" 手动触发
#    - 推送到 main 分支（仅构建校验，出 pkg）
#
#  产物：
#    - FusionEQ-1.0.0-macOS.pkg（通用二进制，AU + AAX + VST3 + Standalone，含系统目录安装位置）
#    - 在 Actions 的 "Artifacts" 里下载，或在打 tag 时可在 Release 中下载
#
#  签名 / 公证（正式分发必须；Apple Developer Program 生效后配置）：
#    在仓库 Settings → Secrets and variables → Actions 中配置：
#      MACOS_CERT_P12              : 把「Developer ID Application」+「Developer ID Installer」
#                                    两张证书连同私钥一起导出为同一个 .p12，再转单行 base64
#                                    （openssl base64 -A -in cert.p12 -out cert.txt）
#      MACOS_CERT_PASSWORD         : .p12 的导出密码
#      MACOS_SIGN_IDENTITY         : 例 "Developer ID Application: Ling Chen (XXXXXXXXXX)"
#                                    （留空则自动探测钥匙串里第一张 Developer ID Application）
#      MACOS_INSTALLER_IDENTITY    : 例 "Developer ID Installer: Ling Chen (XXXXXXXXXX)"
#      APPLE_ID                    : Apple ID 邮箱
#      APPLE_APP_SPECIFIC_PASSWORD : appleid.apple.com 生成的「App 专用密码」
#      APPLE_TEAM_ID               : 10 位 Team ID（developer.apple.com/account 会员页可见）
#    创建证书时若询问 Certificate Intermediary，选 G2 Sub-CA（旧 G1 2027-02-01 失效）。
#    配置后：插件 codesign → PKG productsign → notarytool 公证 → stapler 装订，
#            用户双击直接安装，不再出现「无法打开 / 已损坏 / 仍要打开」。
#    证书类 Secret 缺失时自动跳过签名；公证凭证缺失时自动跳过公证（仍出未签名 pkg）。
#
#  AAX（Pro Tools）支持（可选）：
#    AAX SDK 是 Avid 专有授权软件，【禁止公开分发】，因此不进本仓库。
#    做法：在你的 GitHub 账号下建一个【私有】仓库（如 FusionEQ-AAX-SDK），
#    把 SDK 内容（仓库根目录直接含 Interfaces/AAX.h）推上去，然后配置两个 Secret：
#      AAX_SDK_REPO : 私有仓库全名，如 "1003485516/FusionEQ-AAX-SDK"
#      AAX_SDK_PAT  : 有该私有仓库读权限的 Personal Access Token (classic, scope: repo)
#    配置后 CI 会私密拉取 SDK 并同时产出 VST3 + AU + AAX + Standalone 四个产物。
#    未配置时自动跳过 AAX，只产出 VST3/AU/Standalone（行为与之前一致）。
#
#  说明：
#    - JUCE 版本锁定 7.0.12（项目 CMakeLists 使用了 JUCE 8 已移除的
#      juce_generate_juce_header，故不能用 JUCE 8）。
#    - 注：GitHub Actions 的 if: 条件不允许读取 secrets 上下文，因此是否签名
#      改为在 step 的 shell 脚本内部用环境变量判断（官方推荐做法）。
# ===========================================================================
name: Build macOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

# 允许上传产物；打 tag 时发布到 Release 需要写权限
permissions:
  contents: write

env:
  JUCE_VERSION: "7.0.12"
  AAX_SDK_REPO: ${{ secrets.AAX_SDK_REPO }}   # 工作流级 env 可读 secrets，供 step 的 if 判断

jobs:
  build-macos:
    name: macOS Universal (VST3 + AU + AAX + Standalone)
    # macOS 14 镜像已于 2026-11-02 从 GitHub Actions 退役，旧标签会让 job 秒级取消
    runs-on: macos-15          # ARM runner，可交叉编译 x86_64，产出通用二进制
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 工具链 ----
      - name: Install build tools (cmake, ninja)
        run: |
          brew install cmake ninja || brew upgrade cmake ninja
          cmake --version
          ninja --version

      # ---- 读取版本号（与 CMakeLists 保持一致）----
      - name: Read version
        id: ver
        run: |
          V=$(grep -Eo 'project\([^)]*VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=${V:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${V:-1.0.0}" >> "$GITHUB_ENV"

      # ---- 下载并缓存 JUCE ----
      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/JUCE
          key: juce-${{ env.JUCE_VERSION }}

      - name: Download JUCE ${{ env.JUCE_VERSION }}
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o juce.tar.gz \
            "https://github.com/juce-framework/JUCE/archive/refs/tags/${{ env.JUCE_VERSION }}.tar.gz"
          tar -xzf juce.tar.gz
          mv "JUCE-${{ env.JUCE_VERSION }}" JUCE
          rm juce.tar.gz
          echo "JUCE_DIR=${{ github.workspace }}/JUCE" >> "$GITHUB_ENV"

      - name: Export JUCE_DIR (from cache)
        if: steps.cache-juce.outputs.cache-hit == 'true'
        run: echo "JUCE_DIR=${{ github.workspace }}/JUCE" >> "$GITHUB_ENV"

      # ---- 私密拉取 AAX SDK（私有仓库；未配置 Secret 时跳过）----
      # Avid 禁止公开分发 SDK，故放【私有仓库】+ PAT 拉取，见文件头说明
      - name: Checkout AAX SDK (private)
        if: env.AAX_SDK_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AAX_SDK_REPO }}
          token: ${{ secrets.AAX_SDK_PAT }}
          path: sdk/aax-sdk
          fetch-depth: 1

      # ---- 定位 AAX SDK 根目录（兼容一层/多层嵌套；无 SDK 时留空）----
      - name: Locate AAX SDK
        run: |
          AAX_ROOT=""
          if [ -d sdk/aax-sdk ]; then
            H=$(find sdk/aax-sdk -type f -path '*Interfaces/AAX.h' 2>/dev/null | head -1 || true)
            if [ -n "$H" ]; then
              AAX_ROOT=$(dirname "$(dirname "$H")")
              echo "[*] AAX SDK: $AAX_ROOT"
            fi
          fi
          if [ -n "$AAX_ROOT" ]; then
            echo "AAX_SDK_PATH=$AAX_ROOT" >> "$GITHUB_ENV"
            echo "HAS_AAX=1" >> "$GITHUB_ENV"
          else
            echo "[-] 未配置 AAX SDK Secret，跳过 Pro Tools 版"
            echo "HAS_AAX=0" >> "$GITHUB_ENV"
          fi

      # ---- JUCE 7.0.12 兼容 macOS 15 SDK ----
      # juceaide 会在 CMake configure 阶段编译，必须在 Configure 之前打补丁。
      # 补丁幂等，对已打过补丁的缓存 JUCE 目录会自动跳过。
      - name: Patch JUCE 7.0.12 for macOS 15 SDK
        run: python3 installer/patch_juce_macos15.py "$JUCE_DIR"

      # ---- 配置（通用二进制；有 SDK 时附带 AAX）----
      - name: Configure (CMake)
        run: |
          ARGS="-B build_mac -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64;arm64 \
            -DJUCE_DIR=$JUCE_DIR"
          if [ "$HAS_AAX" = "1" ]; then
            ARGS="$ARGS -DAAX_SDK_PATH=$AAX_SDK_PATH"
          fi
          cmake $ARGS

      # ---- 构建 ----
      - name: Build
        run: cmake --build build_mac --config Release

      # =====================================================================
      #  签名（仅当配置了证书 Secret 时执行；否则步骤内部自动跳过）
      # =====================================================================
      - name: Import Apple signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "[-] MACOS_CERT_P12 未配置，跳过签名"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 用 openssl 解码（macOS 自带 base64 是 BSD 版，--decode 兼容性不稳）
          echo -n "$CERT_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # 补齐证书链：Developer ID G2 中间 CA（旧 G1 将于 2027-02-01 失效）
          # 下载失败不影响后续流程，runner 系统钥匙串里通常已自带
          if curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
               "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              -k "$KEYCHAIN_PATH" -T /usr/bin/codesign 2>/dev/null || true
          fi
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign binaries (VST3 / AU / Standalone)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$KEYCHAIN_PATH" ]; then
            echo "[-] 未导入证书，跳过 codesign"
            exit 0
          fi
          # 优先用显式指定的身份，否则自动检测 Developer ID Application
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            IDENTITY="$MACOS_SIGN_IDENTITY"
          else
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          fi
          if [ -z "$IDENTITY" ]; then
            echo "[X] 未找到 Developer ID Application 证书，请检查 MACOS_CERT_P12 或设置 MACOS_SIGN_IDENTITY"
            exit 1
          fi
          echo "[*] Signing identity: $IDENTITY"
          ART=build_mac/FusionEQ_artefacts/Release
          # hardened runtime + 安全时间戳是公证的硬性要求，缺一不可
          SIGN=(codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN_PATH" --sign "$IDENTITY")
          "${SIGN[@]}" "$ART/VST3/Fusion EQ.vst3"
          "${SIGN[@]}" "$ART/AU/Fusion EQ.component"
          "${SIGN[@]}" "$ART/Standalone/Fusion EQ.app"
          # 注意：这里只做 Apple 签名。AAX 的 PACE/wraptool 签名是另一套，
          # 且必须在 Apple codesign 之后进行，CI 里没有 PACE 工具链。
          if [ -d "$ART/AAX/Fusion EQ.aaxplugin" ]; then
            "${SIGN[@]}" "$ART/AAX/Fusion EQ.aaxplugin"
          fi

      # =====================================================================
      #  打包 pkg（AU + AAX + VST3 + Standalone，带系统目录安装位置）
      #  注：本仓库只出 pkg（用户要求），不再生成 dmg。
      #  - MACOS_INSTALLER_IDENTITY 为空时跳过 productsign（保留未签名 PKG）
      #  - KEYCHAIN_PATH 由「Import Apple signing certificate」步骤注入环境变量
      # =====================================================================
      - name: Package .pkg
        if: always()
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash ./installer/make_pkg.sh

      # =====================================================================
      #  公证（Notarization）+ 装订（Staple）
      #  productsign 后的 PKG 提交 Apple 公证服务，通过后把票据装订进 PKG，
      #  这样用户离线双击安装也能通过 Gatekeeper，不再提示「已损坏 / 无法打开」。
      #  凭证未配齐时跳过，仍产出未公证 PKG（保持旧行为）。
      # =====================================================================
      - name: Notarize & staple PKG
        if: always()
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKG="FusionEQ-${VERSION}-macOS.pkg"
          if [ ! -f "$PKG" ]; then
            echo "[*] $PKG 不存在（前面构建可能失败），跳过公证"
            exit 0
          fi
          if [ -z "${MACOS_INSTALLER_IDENTITY:-}" ] || \
             [ -z "${APPLE_ID:-}" ] || \
             [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || \
             [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "[*] 公证凭证未配齐，跳过 notarize（PKG 未公证）"
            exit 0
          fi
          echo "[*] 提交公证，最长等待 30 分钟 ..."
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          echo "[*] 装订公证票据 ..."
          xcrun stapler staple "$PKG"
          echo "[*] Gatekeeper 校验 ..."
          spctl -a -vvv -t install "$PKG" || true
          echo "[*] staple 会改变 PKG 内容，重新计算 SHA256 ..."
          shasum -a 256 "$PKG" > "$PKG.sha256"
          cat "$PKG.sha256"

      # ---- 上传产物（只上传 pkg）----
      # if: always() 兜底：即便前面某步失败，只要 pkg 已生成也照常上传，
      # 确保总能拿到可安装的包；pkg 缺失时由 if-no-files-found: error 显式报错。
      - name: Upload artifact (pkg + checksum)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FusionEQ-macOS
          path: |
            FusionEQ-${{ steps.ver.outputs.version }}-macOS.pkg
            FusionEQ-${{ steps.ver.outputs.version }}-macOS.pkg.sha256
          if-no-files-found: error

      # ---- 打 tag 时同时发到 Release ----
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FusionEQ-${{ steps.ver.outputs.version }}-macOS.pkg
            FusionEQ-${{ steps.ver.outputs.version }}-macOS.pkg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
